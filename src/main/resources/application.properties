spring.application.name=kafka-report-pipeline

spring.datasource.url=jdbc:postgresql://localhost:5432/reports
spring.datasource.username=reports
spring.datasource.password=reports

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=report-generator
spring.kafka.consumer.auto-offset-reset=earliest
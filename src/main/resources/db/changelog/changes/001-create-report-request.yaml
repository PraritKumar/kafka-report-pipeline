databaseChangeLog:
  - changeSet:
      id: 001-create-report-request
      author: prarit
      changes:
        - createTable:
            tableName: report_request
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: report_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: parameters
                  type: text
              - column:
                  name: file_path
                  type: varchar(500)
              - column:
                  name: error_message
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_report_request_status
            tableName: report_request
            columns:
              - column:
                  name: status